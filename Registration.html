<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrationt</title>
</head>
<body>
    
<h1>Student registration</h1>
<div>
<form action="3"# method="POST">
<div><label for="fname">FirstName</label><input type="text " name="firstName" id="fname" required></div>
<div><label for="lname"> LastName</label><input type="text" name="LastName" id="lname"></div>
<div><label for="email">Email</label><input type="text" name="email" id="email"></div>
<div><label for="gender">gender</label>
    
<input type="radio" name="gender" value="Male"><label for="male"> Male</label>
<input type="radio" name="gender" value="Female"><label for="female"> Female</label></div>
<div><label>spoken languages</label></div>
<input type="checkbox" name="english" value="English" id="eng"><label for="eng">English</label>
<input type="checkbox" name="french" value="French" id="fr" ><label for="fr">French</label>
<input type="checkbox" name="kinya" value="Kinyarwanda" id="rw"><label for="rw">Kinyarwanda</label>
<input type="checkbox" name="swahili" value="Swahili" id="sw"><label for="sw">Swahili</label>
<input type="checkbox" name="Chinese" value="Chinese" id="ch"><label for="ch">Chinese</label>
</div>

<div><label for="dob">Date of Birth</label> <input type="date" name="dob" id="dob"></div>
<div><label for="nationality">Nationality</label>
<select name="nationality" id="nationality">
<option value="">---Select Nationality---</option>
<option value="Rwanda">Rwanda</option>
<option value="Kenya">Kenya</option>
<option value="Uganda">Uganda</option>
<option value="Burundi">Burundi</option>
<option value="DRC">DRC</option>
<option value="USA">USA</option>
</select>
</div>



</form>
</div>



</body>
</html>
